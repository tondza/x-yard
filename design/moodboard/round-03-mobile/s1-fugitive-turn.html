<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>X-Yard — S1 · the Fugitive's own turn · style F (flat vector, 2.5D, day)</title>
<style>
  /* ============================================================
     S1 — THE FUGITIVE'S OWN TURN  ·  round 03, style F
     flat vector · slight 2.5D · day · stage exactly 390x844
     Self-contained: inline CSS only, no external resources.
     Art revision: the map is a real city quarter — individual
     buildings with footprint + lifted roof + near wall, varied
     roof materials, one cast-shadow direction (NW sun), streets
     with kerbs/markings/crossings, a river with banks, quay and
     two structured bridges, a cathedral, a market hall and a
     terminus, trees, and CSS-only city motion.
     ============================================================ */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#0e1c26}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       -webkit-font-smoothing:antialiased;color:#15293c;font-variant-numeric:tabular-nums}
  .stage{position:relative;width:390px;height:844px;overflow:hidden;background:#dfeef8}
  .map{position:absolute;left:0;top:100px;width:390px;height:520px;overflow:hidden;background:#cdd9c6}
  svg.city{position:absolute;left:0;top:0;display:block}

  /* ---------------- TOP BAR (<= 92px) ---------------- */
  .bar{position:absolute;left:0;top:0;width:390px;height:92px;padding:8px 10px 7px;overflow:hidden;
       background:linear-gradient(180deg,#fdfefe,#eef5fa);border-bottom:1px solid #c2d3df;
       box-shadow:0 2px 7px rgba(15,43,66,.10);z-index:6}
  .r1{display:flex;align-items:center;gap:7px;height:27px}
  .tl{font-size:19.5px;font-weight:800;letter-spacing:-.02em;color:#12283c;line-height:1}
  .to{font-size:10.5px;font-weight:800;color:#7e93a6;padding-bottom:2px}
  .me{margin-left:auto;display:flex;align-items:center;gap:5px;
      background:#e5f0f7;border:1px solid #c7dbe8;border-radius:999px;padding:2px 8px 2px 5px}
  .me b{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#0f4a58;text-transform:uppercase}
  .me i{font-size:8px;font-weight:800;letter-spacing:.08em;color:#4c7f8d;font-style:normal}
  .seg{display:flex;gap:2px;height:9px;margin:5px 0 0}
  .seg i{flex:1;border-radius:2.5px;background:#dde6ee}
  .seg i.on{background:linear-gradient(180deg,#4f9cf0,#2f6fed)}
  .seg i.pulse{background:#fdeccd;box-shadow:inset 0 0 0 1.3px #e0a33c}
  .seg i.pulse.on{background:linear-gradient(180deg,#fbbf24,#f59e0b)}
  .seg i.now{box-shadow:inset 0 0 0 1.6px #16283a}
  .r2{display:flex;align-items:center;gap:9px;margin-top:5px}
  .ph{display:flex;align-items:center;gap:6px;background:#0f3a4a;border-radius:8px;padding:4px 8px 4px 5px}
  .ph svg{width:13px;height:13px;fill:none;stroke:#6fe3f2;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .ph b{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#eafcff}
  .pls{margin-left:auto;display:flex;align-items:baseline;gap:5px}
  .pls u{font-size:8px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#8296a9;text-decoration:none}
  .pls b{font-size:12.2px;font-weight:800;color:#a8620c}
  .pls s{font-size:9px;font-weight:800;color:#b8802f;text-decoration:none}

  /* ---------------- MAP LAYER ---------------- */
  .hint{position:absolute;left:0;top:632px;width:390px;height:34px;z-index:4;
        display:flex;align-items:center;gap:8px;padding:0 10px;overflow:hidden;
        background:linear-gradient(180deg,#12374a,#0d2b3b)}
  .hint .sw{width:4px;height:20px;border-radius:2px;background:#a374f0;flex:0 0 auto}
  .hint .tx{display:flex;flex-direction:column;gap:1px;min-width:0}
  .hint b{font-size:10px;font-weight:800;letter-spacing:.03em;color:#eaf7fd;white-space:nowrap;
          line-height:1.15;overflow:hidden;text-overflow:ellipsis}
  .hint .off{display:flex;align-items:center;gap:4px;min-width:0;
        font-size:8.4px;font-weight:800;letter-spacing:.04em;color:#a8c2d2;white-space:nowrap}
  .hint .off svg{width:9px;height:9px;fill:none;stroke:#d98b86;stroke-width:1.8;flex:0 0 auto}
  .frame{position:absolute;left:0;top:100px;width:390px;height:520px;z-index:3;pointer-events:none;
       box-shadow:inset 0 0 0 1px rgba(18,40,60,.16), inset 0 -14px 20px -12px rgba(18,40,60,.28)}

  /* ---------------- BOTTOM TRAY (<= 176px) ---------------- */
  .tray{position:absolute;left:0;bottom:0;width:390px;height:168px;padding:8px 9px 9px;
        background:linear-gradient(180deg,#f8fbfd,#eaf1f7);border-top:1px solid #bfd0dd;
        box-shadow:0 -3px 10px rgba(15,43,66,.12);z-index:6}
  .the{display:flex;align-items:baseline;gap:7px;height:15px;margin-bottom:5px}
  .the b{font-size:9px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#7c90a3}
  .the span{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.06em;color:#4b6a83}
  .kit{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
  .ti{position:relative;height:56px;border-radius:10px;background:#fff;border:1px solid #d3dfe9;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
      min-width:48px;box-shadow:0 1px 2px rgba(20,48,72,.09)}
  .ti .g{width:21px;height:21px;display:block}
  .ti .g path,.ti .g rect,.ti .g circle{vector-effect:non-scaling-stroke}
  .ti .nm{font-size:7.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#5e7488}
  .ti .vl{font-size:12.5px;font-weight:800;line-height:1;color:#16293c}
  .ti.hot{border-color:#7c3aed;background:linear-gradient(180deg,#f8f4ff,#efe6ff);
          box-shadow:0 0 0 2px rgba(124,58,237,.26),0 2px 4px rgba(60,20,120,.18)}
  .ti.hot .nm{color:#5b2bb0}
  .ti.hot .vl{color:#4c1d95}
  .ti.hot .pick{position:absolute;top:-6px;left:50%;transform:translateX(-50%);
      background:#7c3aed;color:#fff;font-size:6.8px;font-weight:800;letter-spacing:.09em;
      border-radius:4px;padding:1.5px 5px;white-space:nowrap}
  .ti.legal{border-color:#93a9bb}
  .ti.off{background:#eef2f6;border-color:#dbe3ea;box-shadow:none}
  .ti.off .nm{color:#93a4b4}
  .ti.off .vl{color:#a2b1bf}
  .ti.off::after{content:"";position:absolute;inset:0;border-radius:10px;
      background:repeating-linear-gradient(135deg,rgba(120,140,158,.16) 0 4px,rgba(120,140,158,0) 4px 8px)}
  /* the metro is unavailable here; the cross is anchored to its own kit cell */
  .ti .offx{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;
      background:#fdeaea;display:flex;align-items:center;justify-content:center}
  .ti .offx svg{width:8px;height:8px;fill:none;stroke:#c0392b;stroke-width:1.8;stroke-linecap:round}
  .tlog{margin-top:8px;height:32px;border-radius:9px;background:#fff;border:1px solid #d3dfe9;
        display:flex;align-items:center;gap:7px;padding:0 8px;overflow:hidden}
  .tlog .cap{font-size:7.8px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8497a9;white-space:nowrap}
  .lr{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .lr .t{font-size:8.6px;font-weight:800;color:#8194a6}
  .lr .w{font-size:8.6px;font-weight:800;letter-spacing:.04em;padding:1px 4px;border-radius:4px;color:#fff}
  .lr .m{font-size:9.6px;font-weight:700;color:#22394e}
  .lsep{width:1px;height:14px;background:#dde5ec}
  .lr .mo{font-size:8.4px;font-weight:800;color:#9aabb9}
  .more{margin-left:auto;font-size:8px;font-weight:800;letter-spacing:.08em;color:#8ea0b1;white-space:nowrap}

  /* ---------------- city motion (CSS only, calm loops) ---------------- */
  .fig{animation:bob 2.7s ease-in-out infinite}
  .fig.d1{animation-delay:.55s}
  .fig.d2{animation-delay:1.1s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.7px)}}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
  .sway.d1{animation-delay:1.7s}
  .sway.d2{animation-delay:3.4s}
  @keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
  .shimmer{animation:shimmer 12s linear infinite}
  @keyframes shimmer{to{stroke-dashoffset:-430}}
  .sail{animation:sail 38s linear infinite}
  @keyframes sail{0%{transform:translate(0,0);opacity:0}5%{opacity:.97}93%{opacity:.97}100%{transform:translate(468px,3px);opacity:0}}
  .row{animation:row 26s linear infinite}
  @keyframes row{0%{transform:translate(0,0);opacity:0}10%{opacity:.95}90%{opacity:.95}100%{transform:translate(-330px,2px);opacity:0}}
  .drive{animation:drive 14s linear infinite}
  @keyframes drive{0%{transform:translate(0,0) rotate(3.2deg);opacity:0}9%{opacity:1}88%{opacity:1}100%{transform:translate(112px,6px) rotate(3.2deg);opacity:0}}
  .lamp{animation:lampglow 4.6s ease-in-out infinite}
  .lamp.d1{animation-delay:1.5s}
  .lamp.d2{animation-delay:3s}
  @keyframes lampglow{0%,100%{opacity:.3}50%{opacity:.95}}
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- ================= MAP : 390x520 world box ================= -->
  <div class="map">
    <svg class="city" id="city" width="390" height="520" viewBox="0 0 390 520"
         role="img" aria-label="Cathedral Quarter: an illustrated city map with rooftops, kerbed streets, a river with two bridges, a cathedral, a market hall and a rail terminus. Your Vulture marker stands at n6. Legal moves: on foot to n2 and n9, taxi to n5, bus to n4, scooter two-edge route to n3, metro unavailable. Falcon at n5, Harrier at n10.">
      <defs>
        <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">

  </div>

  <!-- one-line map hint: the mode in hand, and why metro is dead here -->

    </span>

  <!-- ================= TOP BAR : 92px ================= -->
  <header class="bar">
    <div class="r1">
      <span class="tl">TURN 07</span><span class="to">/ 16</span>
      <span class="me">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="6.6" fill="#e5484d"/>
          <path d="M8 3.3 9.4 6.5 12.7 6.9 10.3 9.2 11 12.4 8 10.8 5 12.4 5.7 9.2 3.3 6.9 6.6 6.5z" fill="#fff"/>
        </svg>

<script>
(function(){
  "use strict";
  var f = function(n){ return Math.round(n*100)/100; };
  function shade(hex, amt){
    var n = parseInt(hex.slice(1),16),
        r = Math.max(0,Math.min(255,(n>>16)+amt)),
        g = Math.max(0,Math.min(255,((n>>8)&255)+amt)),
        b = Math.max(0,Math.min(255,(n&255)+amt));
    return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  /* deterministic pseudo-random: the quarter is identical on every load */
  var seed = 0x51f3a7;
  function rnd(){ seed = (seed*1664525+1013904223)>>>0; return seed/4294967296; }
  function rr(a,b){ return a+(b-a)*rnd(); }

  /* =========================================================
     1 · THE QUARTER — station coordinates are the brief's
     390x520 world box. The ground plane carries a very slight
     2.5D lean; the network, markers, numbers and icons are
     projected through the same map so they stay bound to the
     streets, then drawn upright in a flat overlay layer.
     ========================================================= */
  var NODE = {
    n1 : { x:55,  y:120, cls:"street" },
    n2 : { x:140, y:95,  cls:"street" },
    n3 : { x:250, y:120, cls:"street" },
    n4 : { x:330, y:175, cls:"hub"    },
    n5 : { x:95,  y:225, cls:"street" },
    n6 : { x:205, y:240, cls:"hub"    },
    n7 : { x:300, y:300, cls:"terminal"},
    n8 : { x:70,  y:340, cls:"street" },
    n9 : { x:200, y:360, cls:"street" },
    n10: { x:345, y:90,  cls:"terminal"}
  };

  /* the single ground transform shared by everything on the map plane */
  var S=1.16;
  var MA=0.99*S, MB=0.012*S, MC=-0.02*S, MD=0.95*S, ME=-24, MF=44;
  function gx(x,y){ return f(MA*x + MC*y + ME); }
  function gy(x,y){ return f(MB*x + MD*y + MF); }
  var P = {};
  Object.keys(NODE).forEach(function(k){
    P[k] = { x:NODE[k].x, y:NODE[k].y, cls:NODE[k].cls,
             sx:gx(NODE[k].x, NODE[k].y), sy:gy(NODE[k].x, NODE[k].y) };
  });
  var GP = function(pts){
    return pts.map(function(p){ return [gx(p[0],p[1]), gy(p[0],p[1])]; });
  };
  var poly = function(pts){ return "M" + pts.map(function(p){ return f(p[0])+","+f(p[1]); }).join(" L"); };
  var polyZ = function(pts){ return poly(pts) + " Z"; };
  var rectStr = function(x,y,w,h,fill,extra){
    return '<rect x="'+f(x)+'" y="'+f(y)+'" width="'+f(w)+'" height="'+f(h)+'" fill="'+fill+'"'+(extra||'')+'/>';
  };
  var circ = function(x,y,r,fill,extra){
    return '<circle cx="'+f(x)+'" cy="'+f(y)+'" r="'+f(r)+'" fill="'+fill+'"'+(extra||'')+'/>';
  };
  /* ground-space rectangle -> projected quad [NW, NE, SE, SW] */
  var gq = function(x,y,w,h){
    return GP([[x,y],[x+w,y],[x+w,y+h],[x,y+h]]);
  };
  /* quad interpolation: u runs NW->NE, v runs NW->SW */
  var qp = function(q,u,v){
    return [ q[0][0]+u*(q[1][0]-q[0][0])+v*(q[3][0]-q[0][0]),
             q[0][1]+u*(q[1][1]-q[0][1])+v*(q[3][1]-q[0][1]) ];
  };
  var seg = function(q,u1,v1,u2,v2,stroke,w,op){
    var a=qp(q,u1,v1), b=qp(q,u2,v2);
    return '<path d="M'+f(a[0])+','+f(a[1])+' L'+f(b[0])+','+f(b[1])+'" stroke="'+stroke+
           '" stroke-width="'+w+'" stroke-opacity="'+(op===undefined?1:op)+'" fill="none" stroke-linecap="round"/>';
  };

  /* =========================================================
     2 · STREETS — the walkable network. Waypoints make every
     street a polyline with real bends; the move paths below
     reuse these same vertices, which is why they bend with the
     roads they are drawn along.
     ========================================================= */
  var STREET = {
    "n1-n2":[ [55,120],[74,108],[98,101],[118,99],[140,95] ],
    "n2-n3":[ [140,95],[181,107],[216,102],[241,125],[250,120] ],
    "n3-n4":[ [250,120],[276,138],[299,154],[330,175] ],
    "n1-n5":[ [55,120],[64,152],[75,188],[95,225] ],
    "n2-n6":[ [140,95],[194,96],[196,144],[187,200],[205,240] ],
    "n5-n6":[ [95,225],[131,226],[174,252],[205,240] ],
    "n3-n6":[ [250,120],[236,150],[200,172],[205,240] ],
    "n4-n7":[ [330,175],[319,210],[311,250],[300,300] ],
    "n6-n7":[ [205,240],[246,270],[280,268],[300,300] ],
    "n5-n8":[ [95,225],[83,258],[75,300],[70,340] ],
    "n6-n9":[ [205,240],[211,281],[196,327],[200,360] ],
    "n8-n9":[ [70,340],[120,344],[160,340],[200,360] ],
    "n9-n7":[ [200,360],[226,349],[248,330],[300,300] ]
  };
  var RIGHT_OF = {
    "n6-n2":[ [199,190],[181,136],[162,102],[140,95] ],
    "n6-n3":[ [226,150],[250,162],[276,152],[241,125],[216,102],[181,107],[140,95] ]
  };
  /* bus routes are hub-to-hub / terminal roads and they cross blocks */
  var BUS = {
    "n4-n6":[ [330,175],[295,182],[272,190],[235,214],[205,240] ],
    "n4-n10":[ [330,175],[357,157],[360,116],[338,97],[345,90] ],
    "n10-n7":[ [345,90],[364,126],[340,150],[302,184],[318,266],[300,300] ]
  };
  /* metro: terminal to terminal, the one service allowed to cross blocks */
  var METRO = [ [300,300],[315,246],[330,168],[345,90] ];
  /* special / alleyway: the secret link, also allowed to cross blocks */
  var SPECIAL = [ [140,95],[166,156],[190,210],[198,262],[200,310],[200,360] ];

  /* decorative lanes and the riverside approach roads — never travel edges */
  var EXTRA = [
    [ [55,120],[34,104],[6,96] ],
    [ [140,95],[150,70],[166,50] ],
    [ [250,120],[262,92],[280,70] ],
    [ [345,90],[368,74],[400,60] ],
    [ [70,340],[44,350],[10,346] ],
    [ [300,300],[330,300],[370,296],[410,292] ],
    [ [186,240],[240,238],[290,236] ],
    [ [96,168],[92,196],[96,224] ]
  ];
  /* the two bridges carry roads on across the water */
  var BRIDGE_A = [ [118,344],[120,376],[122,412],[124,436] ];
  var BRIDGE_B = [ [200,360],[201,378],[203,412],[205,440] ];

  /* =========================================================
     3 · PLACES — landmarks, water and green space. These are
     the pockets the buildings are kept out of.
     ========================================================= */
  var RIV = 12;                                        /* half-width, world units */
  var riverPts = [ [-30,380],[40,386],[100,392],[160,394],[220,394],[280,392],[340,388],[400,382] ];
  function riverYAt(x){
    for(var i=0;i<riverPts.length-1;i++){
      if(x>=riverPts[i][0] && x<=riverPts[i+1][0]){
        var t=(x-riverPts[i][0])/(riverPts[i+1][0]-riverPts[i][0]);
        return riverPts[i][1]+t*(riverPts[i+1][1]-riverPts[i][1]);
      }
    }
    return riverPts[0][1];
  }
  var CATH = { x:34,  y:44,  w:86, d:44 };   /* cathedral with tower and spires */
  var HALL = { x:96,  y:126, w:42, d:42 };   /* market hall — the hub building   */
  var TERM = { x:318, y:310, w:42, d:40 };   /* terminus with a train shed       */
  var PARK = { x:96,  y:268, w:90, d:58 };   /* public park with a pond          */
  var SQ_HUB = { x:186, y:220, w:46, d:42 }; /* station square around n6         */
  var SQ_MKT = { x:92,  y:172, w:54, d:24 }; /* market square with stalls        */
  var ALLOT = { x:130, y:410, w:56, d:22 };  /* river gardens on the far bank    */

  /* =========================================================
     4 · OCCUPANCY GRID — a building may never stand on a road,
     a station, the water or a landmark. Same idea as the
     round-02 city, sized for a phone map.
     ========================================================= */
  var GS=3, GX0=-30, GY0=-22, GW=156, GH=160;
  var occ = new Uint8Array(GW*GH);
  function cix(x){ return Math.floor((x-GX0)/GS); }
  function ciy(y){ return Math.floor((y-GY0)/GS); }
  function markRectW(x,y,w,h,pad){
    pad = pad||0;
    var i0=Math.max(0,cix(x-pad)), i1=Math.min(GW-1,cix(x+w+pad));
    var j0=Math.max(0,ciy(y-pad)), j1=Math.min(GH-1,ciy(y+h+pad));
    for(var j=j0;j<=j1;j++) for(var i=i0;i<=i1;i++) occ[j*GW+i]=1;
  }
  function distSeg(px,py,ax,ay,bx,by){
    var vx=bx-ax, vy=by-ay, wx=px-ax, wy=py-ay;
    var L=vx*vx+vy*vy, t=L?Math.max(0,Math.min(1,(wx*vx+wy*vy)/L)):0;
    return Math.hypot(px-(ax+t*vx), py-(ay+t*vy));
  }
  function markSeg(ax,ay,bx,by,r){
    var i0=Math.max(0,cix(Math.min(ax,bx)-r)), i1=Math.min(GW-1,cix(Math.max(ax,bx)+r));
    var j0=Math.max(0,ciy(Math.min(ay,by)-r)), j1=Math.min(GH-1,ciy(Math.max(ay,by)+r));
    for(var j=j0;j<=j1;j++) for(var i=i0;i<=i1;i++){
      if(distSeg(i*GS+GX0+GS/2, j*GS+GY0+GS/2, ax,ay,bx,by) <= r) occ[j*GW+i]=1;
    }
  }
  function markPath(pts,r){
    for(var i=0;i<pts.length-1;i++) markSeg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],r);
  }
  function freeRectW(x,y,w,h,pad){
    pad = pad||0;
    var i0=Math.max(0,cix(x-pad)), i1=Math.min(GW-1,cix(x+w+pad));
    var j0=Math.max(0,ciy(y-pad)), j1=Math.min(GH-1,ciy(y+h+pad));
    for(var j=j0;j<=j1;j++) for(var i=i0;i<=i1;i++) if(occ[j*GW+i]) return false;
    return true;
  }

  var streetPolys=[], st, s2;
  for(st in STREET) streetPolys.push({pts:STREET[st], w:10.5, half:4.6, main:false});
  for(st in BUS)    streetPolys.push({pts:BUS[st],    w:13,   half:5.6, main:true});
  var lanePolys=[];
  EXTRA.forEach(function(p){ lanePolys.push({pts:p, w:8, half:3.6}); });
  lanePolys.push({pts:BRIDGE_A, w:10.5, half:4.6, bridge:true});
  lanePolys.push({pts:BRIDGE_B, w:10.5, half:4.6, bridge:true});

  streetPolys.forEach(function(s){ markPath(s.pts, s.half+3); });
  lanePolys.forEach(function(s){ markPath(s.pts, s.half+2.8); });
  markPath(METRO, 8);
  markPath(SPECIAL, 6.5);
  Object.keys(NODE).forEach(function(k){ markRectW(NODE[k].x-16,NODE[k].y-16,32,32,0); });
  markPath(riverPts, RIV+7);
  [CATH,HALL,TERM].forEach(function(r){ markRectW(r.x-2,r.y-2,r.w+4,r.d+4,0); });
  [SQ_HUB,SQ_MKT].forEach(function(r){ markRectW(r.x,r.y,r.w,r.d,0); });
  markRectW(PARK.x,PARK.y,PARK.w,PARK.d,0);
  markRectW(ALLOT.x-2,ALLOT.y-2,ALLOT.w+4,ALLOT.d+4,0);
  markRectW(8,486,52,30,0);        /* compass plate on the far bank  */
  markRectW(268,488,110,28,0);     /* scale plate on the far bank    */
  markRectW(TERM.x-4,TERM.y+TERM.d,TERM.w+10,26,0);  /* rail yard      */

  /* =========================================================
     5 · BUILDINGS — footprint, near wall, lifted roof face.
     One shadow direction for the whole city: sun north-west,
     shadows fall south-east.
     ========================================================= */
  var MATS = [
    {c:"#c96f4e",t:0}, {c:"#d9825c",t:0}, {c:"#b8563c",t:0}, {c:"#dfa45f",t:0},
    {c:"#c98f5f",t:0}, {c:"#7f909c",t:1}, {c:"#6e8494",t:1}, {c:"#9aa8b4",t:1},
    {c:"#a8896f",t:1}, {c:"#dfc07f",t:2}, {c:"#cdbfae",t:2}, {c:"#7fb59a",t:3},
    {c:"#5f9c86",t:3}, {c:"#b9cdd8",t:4}, {c:"#c2a184",t:0}, {c:"#8f9ea8",t:1}
  ];
  var WALLS = ["#f2dcbe","#eed3ae","#e9dfcd","#f0d5bd","#e8c9b2","#dfe6ea","#d6e0e6",
               "#e8ecef","#f0e2c4","#e5d1b0","#e9dfd4","#dccfbd","#efd5b9","#e0d5c5"];
  var blds=[], yards=[], placedCount=0;

  function tryPlace(x,y,w,d,hi){
    x=Math.round(x); y=Math.round(y);
    if(x<-28 || y<-18 || x+w>426 || y+d>440) return false;
    if(!freeRectW(x,y,w,d,1.5)) return false;
    markRectW(x,y,w,d,2);
    var depth = d*1.102;
    var lift = Math.max(6, Math.min(depth*hi, 44));
    var mi = Math.floor(rnd()*MATS.length);
    var wpx = w*1.148;
    var roll = rnd();
    var kind = 0;                                     /* 0 flat · 1 hip · 2 gable */
    if(lift < 25 && wpx < 36) kind = roll<0.40 ? 1 : (roll<0.70 ? 2 : 0);
    blds.push({
      x:x, y:y, w:w, d:d, lift:lift, mat:MATS[mi], wall:WALLS[mi % WALLS.length],
      kind:kind, seed:rnd(),
      rise: kind===2 ? Math.min(9+d*0.34,16) : (kind===1 ? Math.min(6+d*0.24,12) : 0),
      chimneys: (kind?1:0) + (rnd()<0.45?1:0),
      awning: rnd()<0.17,
      clutter: rnd()<0.3
    });
    placedCount++;
    return true;
  }

  /* pass 1 — city blocks */
  for(var py=-12; py<428; py+=14){
    for(var px=-22; px<418; px+=15){
      if(rnd()<0.06) continue;
      var w1=rr(11,21), d1=rr(9,17), r1=rnd();
      if(r1<0.15){ w1=rr(22,34); d1=rr(15,24); }
      else if(r1>0.88){ w1=rr(16,25); d1=rr(12,19); }
      var hi, r2=rnd();
      if(r2<0.58) hi=rr(0.72,1.2);
      else if(r2<0.82) hi=rr(1.2,1.75);
      else if(r2<0.94) hi=rr(1.75,2.5);
      else hi=rr(2.5,3.4);
      tryPlace(px+rr(-3,3), py+rr(-3,3), w1, d1, hi);
    }
  }
  /* pass 2 — back-street infill */
  for(py=-14; py<430; py+=9){
    for(px=-20; px<418; px+=9){
      if(rnd()<0.30) continue;
      tryPlace(px+rr(-2,2), py+rr(-2,2), rr(6,12), rr(5,10), rr(0.72,1.6));
    }
  }
  /* pass 3 — yards, courtyards and small gardens between the blocks */
  for(py=-12; py<432; py+=8){
    for(px=-18; px<420; px+=8){
      if(rnd()<0.54) continue;
      var yw=rr(4.5,9), yd=rr(4,7.5), yx=Math.round(px+rr(-3,3)), yy=Math.round(py+rr(-3,3));
      if(yx<-24||yy<-14||yx+yw>424||yy+yd>438) continue;
      if(!freeRectW(yx,yy,yw,yd,0.5)) continue;
      markRectW(yx,yy,yw,yd,1);
      yards.push({x:yx,y:yy,w:yw,d:yd,k:rnd()});
    }
  }

  /* ---------- roof material: painted courses, slates, speckle, seams, panes ---------- */
  function roofTex(q, mat, sd){
    var out="", c=mat.c, v, u, i;
    if(mat.t===0){                       /* clay pantile */
      for(v=0.24; v<0.92; v+=0.23) out += seg(q,0.05,v,0.95,v, shade(c,-34),1,.62);
      for(u=0.22; u<0.95; u+=0.24) out += seg(q,u,0.03,u,0.97, shade(c,-20),.7,.34);
    } else if(mat.t===1){                /* slate */
      for(v=0.16; v<0.95; v+=0.15) out += seg(q,0.05,v,0.95,v, shade(c,-20),.7,.55);
      for(u=0.3; u<0.95; u+=0.35) out += seg(q,u,0.04,u,0.96, shade(c,-12),.6,.3);
    } else if(mat.t===2){                /* gravel */
      for(i=0;i<7;i++){
        var gp2=qp(q, 0.1+((sd*7+i*0.37)%1)*0.8, 0.1+((sd*11+i*0.53)%1)*0.8);
        out += circ(gp2[0],gp2[1],1.1, shade(c,-36), ' opacity=".5"');
      }
    } else if(mat.t===3){                /* oxidised copper */
      for(v=0.32; v<0.95; v+=0.3) out += seg(q,0.04,v,0.96,v, shade(c,-24),1.1,.5);
      out += seg(q,0.5,0.03,0.5,0.97, shade(c,16),1,.35);
    } else {                             /* glass / leaded roof */
      for(u=0.33; u<0.92; u+=0.33) out += seg(q,u,0.04,u,0.96,"#ffffff",1,.55);
      for(v=0.33; v<0.92; v+=0.33) out += seg(q,0.04,v,0.96,v,"#ffffff",1,.55);
      out += '<path d="'+polyZ(q)+'" fill="#ffffff" fill-opacity=".09"/>';
    }
    return out;
  }
  function roofStr(b, q){
    var c=b.mat.c, out="", rise=b.rise, i, p;
    if(rise>1.5){
      var ru = b.kind===1 ? 0.24 : 0.0;
      var R0=qp(q,ru,0.5), R1=qp(q,1-ru,0.5);
      R0=[R0[0],R0[1]-rise]; R1=[R1[0],R1[1]-rise];
      /* north slope sits behind the ridge and catches the light */
      out += '<path d="'+polyZ([q[0],q[1],R1,R0])+'" fill="'+shade(c,26)+'"/>';
      out += '<path d="'+polyZ([q[0],q[3],R0])+'" fill="'+shade(c,-12)+'"/>';
      out += '<path d="'+polyZ([q[1],q[2],R1])+'" fill="'+shade(c,-26)+'"/>';
      out += '<path d="'+polyZ([q[3],q[2],R1,R0])+'" fill="'+c+'"/>';
      out += roofTex([R0,R1,q[2],q[3]], b.mat, b.seed);
      out += '<path d="M'+f(R0[0])+','+f(R0[1])+' L'+f(R1[0])+','+f(R1[1])+
             '" stroke="'+shade(c,32)+'" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
    } else {
      out += '<path d="'+polyZ(q)+'" fill="'+c+'"/>';
      out += roofTex(q, b.mat, b.seed);
      out += seg(q,0.03,0.04,0.97,0.04, shade(c,30),2,.6);          /* sunlit far edge */
      var iq=[qp(q,0.07,0.07),qp(q,0.93,0.07),qp(q,0.93,0.93),qp(q,0.07,0.93)];
      out += '<path d="'+polyZ(iq)+'" fill="none" stroke="'+shade(c,-32)+'" stroke-opacity=".4" stroke-width="1.3"/>';
    }
    /* chimneys, tanks and roof clutter — the small life of a roofscape */
    for(i=0;i<b.chimneys;i++){
      p = qp(q, 0.14 + ((b.seed*3.7+i*0.41)%1)*0.72, 0.16 + ((b.seed*5.1+i*0.57)%1)*0.68);
      var cw=4.2, chh=7+b.seed*5;
      out += rectStr(p[0]-cw/2, p[1]-chh-rise, cw, chh+3, "#c08a6b");
      out += rectStr(p[0]-cw/2-0.9, p[1]-chh-rise-2.4, cw+1.8, 2.6, "#a9724f");
    }
    if(b.clutter){
      p = qp(q,0.72,0.28);
      out += rectStr(p[0]-4, p[1]-6, 8, 6, "#c3ccd2", ' rx="1"');
      out += rectStr(p[0]-1, p[1]-9, 3, 3, "#aeb8bf");
    }
    if(b.seed>0.86 && b.w>22 && b.d>16){
      p = qp(q,0.2,0.78);
      out += rectStr(p[0]-6, p[1]-7, 12, 7, "#8ec47f", ' rx="2"');
    }
    return out;
  }
  function wallStr(b, q, lift){
    var out="", i, r, cc, c=b.wall;
    out += '<path d="'+polyZ([q[3],q[2],[q[2][0],q[2][1]-lift],[q[3][0],q[3][1]-lift]])+'" fill="'+c+'"/>';
    var wpx = Math.hypot(q[2][0]-q[3][0], q[2][1]-q[3][1]);
    var plinth = Math.min(lift*0.28, 7);
    var pitch = 7.2;
    var cols = Math.max(1, Math.min(6, Math.floor((wpx-3)/7.4)));
    var rows = lift>14 ? Math.max(1, Math.min(5, Math.floor((lift-plinth-4)/pitch))) : 0;
    var glass = b.seed<0.34 ? "#5f96b8" : (b.seed<0.7 ? "#79acc9" : "#93c1d8");
    /* a storey band under every window row, so a tall blank wall reads as floors */
    for(r=0;r<rows;r++){
      var ly=q[3][1]-plinth-1.6-r*pitch;
      out += '<path d="M'+f(q[3][0])+','+f(ly)+' L'+f(q[2][0])+','+f(ly)+
             '" stroke="'+shade(c,-30)+'" stroke-opacity=".22" stroke-width="1" fill="none"/>';
    }
    for(r=0;r<rows;r++){
      for(cc=0;cc<cols;cc++){
        var u=(cc+0.5)/cols;
        var wx=q[3][0]+u*(q[2][0]-q[3][0]);
        var wy=q[3][1]+u*(q[2][1]-q[3][1]) - plinth - 3.4 - r*pitch;
        out += rectStr(wx-2.2, wy-5.4, 4.4, 5.4, glass, ' rx="1"');
        out += rectStr(wx-2.2, wy-5.4, 4.4, 1.4, "#ffffff", ' rx="1" opacity=".3"');
      }
    }
    /* the near base of a tall facade is in its own shade */
    out += '<path d="'+polyZ([q[3],q[2],[q[2][0],q[2][1]-lift*0.34],[q[3][0],q[3][1]-lift*0.34]])+
           '" fill="#2b3d4c" opacity=".08"/>';
    /* plinth, door, awning */
    out += '<path d="'+polyZ([q[3],q[2],[q[2][0],q[2][1]-plinth],[q[3][0],q[3][1]-plinth]])+'" fill="'+shade(c,-26)+'"/>';
    if(wpx>22 && b.seed>0.42){
      var du=0.18+b.seed*0.6, dx=q[3][0]+du*(q[2][0]-q[3][0]);
      var dy=q[3][1]+du*(q[2][1]-q[3][1]);
      out += rectStr(dx-2.6, dy-plinth*0.92, 5.2, plinth*0.92, "#8a6a52", ' rx="1"');
    }
    if(b.awning){
      out += '<path d="'+polyZ([q[3],q[2],[q[2][0],q[2][1]-4.4],[q[3][0],q[3][1]-4.4]])+
             '" fill="'+(b.seed<0.5?"#c85a52":"#3f7f8c")+'" opacity=".92"/>';
    }
    /* cornice where the wall meets the roof */
    out += '<path d="M'+f(q[3][0])+','+f(q[3][1]-lift)+' L'+f(q[2][0])+','+f(q[2][1]-lift)+
           '" stroke="'+shade(b.mat.c,-34)+'" stroke-opacity=".85" stroke-width="2.4" fill="none"/>';
    out += '<path d="M'+f(q[3][0])+','+f(q[3][1]-lift+2.6)+' L'+f(q[2][0])+','+f(q[2][1]-lift+2.6)+
           '" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.2" fill="none"/>';
    return out;
  }
  function buildingStr(b){
    var q=gq(b.x,b.y,b.w,b.d);
    var rq=q.map(function(p){ return [p[0], p[1]-b.lift]; });
    return wallStr(b,q,b.lift) + roofStr(b,rq);
  }
  function shadowStr(x,y,w,d,lift){
    var dx=3.2+0.22*lift, dy=2.4+0.15*lift, q=gq(x,y,w,d), i;
    var a=[], bq=[];
    for(i=0;i<4;i++){
      a.push([q[i][0]+dx, q[i][1]+dy]);
      bq.push([q[i][0]+dx*0.45, q[i][1]+dy*0.45]);
    }
    return '<path d="'+polyZ(a)+'" fill="#3d5a66" opacity=".19"/>'+
           '<path d="'+polyZ(bq)+'" fill="#3d5a66" opacity=".11"/>';
  }
  function yardStr(y){
    var k=y.k, out="";
    if(k<0.4){
      out += '<path d="'+polyZ(gq(y.x,y.y,y.w,y.d))+'" fill="#a9d79c"/>';
      out += circ(y.x+y.w*0.32, y.y+y.d*0.45, Math.min(y.w,y.d)*0.27, "#7cbb72");
      out += circ(y.x+y.w*0.7,  y.y+y.d*0.66, Math.min(y.w,y.d)*0.2, "#8ecb83");
    } else if(k<0.72){
      out += '<path d="'+polyZ(gq(y.x,y.y,y.w,y.d))+'" fill="#d3d7c5"/>';
      out += '<path d="'+polyZ(gq(y.x,y.y,y.w,y.d))+'" fill="none" stroke="#c2c8b4" stroke-width="1"/>';
    } else if(k<0.87){
      out += '<path d="'+polyZ(gq(y.x,y.y,y.w,y.d))+'" fill="#cfd3c2"/>';
      out += rectStr(qp(gq(y.x,y.y,y.w,y.d),0.12,0.2)[0], qp(gq(y.x,y.y,y.w,y.d),0.12,0.2)[1], 6,3.4,"#b0b8bd",' rx="1.2"');
      out += rectStr(qp(gq(y.x,y.y,y.w,y.d),0.58,0.2)[0], qp(gq(y.x,y.y,y.w,y.d),0.58,0.2)[1], 6,3.4,"#a8b0b6",' rx="1.2"');
    } else {
      out += '<path d="'+polyZ(gq(y.x,y.y,y.w,y.d))+'" fill="#d8d3c1"/>';
    }
    return out;
  }

  /* =========================================================
     6 · LANDMARKS — drawn with the same footprint + wall +
     lifted roof logic, so they stand up with the city.
     ========================================================= */
  function cathedralStr(){
    var x=CATH.x, y=CATH.y, w=CATH.w, d=CATH.d, out="";
    var q=gq(x,y,w,d), lift=26;
    var ny=q[3][1], wy=ny-lift, i, u;
    var rq=q.map(function(p){ return [p[0],p[1]-lift]; });
    /* apse first, so the nave wall reads in front of it */
    var ap=qp(rq,0.99,0.5);
    out += '<ellipse cx="'+f(ap[0]+2)+'" cy="'+f(ap[1]+13)+'" rx="13" ry="16" fill="#e9dcc6"/>';
    out += '<ellipse cx="'+f(ap[0]+2)+'" cy="'+f(ap[1]+9)+'" rx="11" ry="13" fill="#6b7d89"/>';
    /* nave wall with lancets and buttresses */
    out += '<path d="'+polyZ([q[3],q[2],[q[2][0],q[2][1]-lift],[q[3][0],q[3][1]-lift]])+'" fill="#f4e9d6"/>';
    for(i=0;i<6;i++){
      u=(i+0.5)/6;
      var bx=q[3][0]+u*(q[2][0]-q[3][0]);
      out += rectStr(bx-2.2, wy+4, 4.4, lift-7, "#6d9ec0", ' rx="2.2"');
      out += rectStr(bx-2.2, wy+4, 4.4, lift-7, "none", ' rx="2.2" stroke="#c9bda6" stroke-width="1"');
    }
    out += circ(q[3][0]+(q[2][0]-q[3][0])*0.5, wy+11, 4.6, "#7fa8c4");
    out += circ(q[3][0]+(q[2][0]-q[3][0])*0.5, wy+11, 4.6, "none", ' stroke="#e6d9c1" stroke-width="1.4"');
    out += rectStr(q[3][0], ny-4.5, q[2][0]-q[3][0], 4.5, "#ded0b8");
    for(i=0;i<=7;i++){
      u=i/7;
      var bxx=q[3][0]+u*(q[2][0]-q[3][0]);
      out += rectStr(bxx-1.7, wy-2, 3.4, lift+2, "#e6d9c1");
    }
    /* porch */
    out += rectStr(q[3][0]+(q[2][0]-q[3][0])*0.5-8, ny-6, 16, 12, "#e6d9c1", ' rx="2"');
    out += rectStr(q[3][0]+(q[2][0]-q[3][0])*0.5-3, ny-4, 6, 10, "#8a6a52", ' rx="1"');
    out += '<path d="M'+f(q[3][0])+','+f(wy)+' L'+f(q[2][0])+','+f(wy)+'" stroke="#5c6c78" stroke-width="2.4" fill="none"/>';
    /* steep pitched slate nave roof */
    var rise=18, R0=qp(rq,0.02,0.5), R1=qp(rq,0.98,0.5);
    R0=[R0[0],R0[1]-rise]; R1=[R1[0],R1[1]-rise];
    out += '<path d="'+polyZ([rq[0],rq[1],R1,R0])+'" fill="#8395a1"/>';

    var segs=[], total=0, i;
    for(i=0;i<pts.length-1;i++){
      var L = Math.hypot(pts[i+1][0]-pts[i][0], pts[i+1][1]-pts[i][1]);
      segs.push(L); total += L;

    var want = total*t, acc=0;
    for(i=0;i<segs.length;i++){
      if(acc+segs[i] >= want || i===segs.length-1){
        var k = segs[i]? (want-acc)/segs[i] : 0;
        k = Math.max(0, Math.min(1, k));
        return { x: pts[i][0]+(pts[i+1][0]-pts[i][0])*k,
                 y: pts[i][1]+(pts[i+1][1]-pts[i][1])*k,
                 a: Math.atan2(pts[i+1][1]-pts[i][1], pts[i+1][0]-pts[i][0])*180/Math.PI };

    }

    g.push('<ellipse rx="13.5" ry="10.6" fill="none" stroke="#ffffff" stroke-opacity=".72" stroke-width="1.1"/>');
    if(o.you){
      g.push('<ellipse rx="19.5" ry="15.4" fill="none" stroke="'+o.col+'" stroke-width="1.9" stroke-dasharray="5 4"/>');
    }
    g.push('<g transform="scale('+sc+')"><g class="'+(o.cls||"fig")+'">'+figStr(o.col,o.hair)+'</g></g>');
    g.push('<g transform="translate(0,'+f(-46*sc-9)+')">'+
      '<rect x="'+f(-tagW/2)+'" y="-8.5" width="'+f(tagW)+'" height="17" rx="5.5" fill="'+o.bg+'"/>'+
      '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="8.8" font-weight="800" letter-spacing=".05em" fill="#ffffff">'+o.name+'</text></g>');
    g.push('</g>');
    chr.push(g.join(""));
  }
  markStr({ id:"n6",  name:"VULTURE · YOU", col:"#e5484d", hair:"#3a2b1f", bg:"#0d3b46", you:true, dx:22, dy:16 });
  markStr({ id:"n5",  name:"A1 FALCON", col:"#2f6fed", hair:"#123047", bg:"#17407f", dx:20, dy:16, cls:"fig d1" });
  markStr({ id:"n10", name:"A2 HARRIER", col:"#d2504a", hair:"#3a2b1f", bg:"#7f1d21", dx:-24, dy:18, cls:"fig d2" });

  /* =========================================================
     12 · FURNITURE — compass, scale, district name. Kept upright
     and over the far bank, where nothing is competing for room.
     ========================================================= */
  function haloStroke(w){ return ' stroke="#ffffff" stroke-width="'+w+'" stroke-opacity=".92" paint-order="stroke"'; }
  furn.push('<text x="376" y="21" text-anchor="end" font-size="10.4" font-weight="800" letter-spacing=".12em" fill="#33485c"'+haloStroke(3.2)+'>CATHEDRAL QUARTER · 9 STATIONS</text>');
  furn.push('<text x="376" y="35" text-anchor="end" font-size="8.4" font-weight="800" letter-spacing=".1em" fill="#6d7f90"'+haloStroke(2.8)+'>LIGHT RAIL CALLS AT TERMINALS n7 · n10</text>');
  furn.push('<g transform="translate(28,502)">'+
    '<circle r="15" fill="#ffffff" fill-opacity=".9"/><circle r="15" fill="none" stroke="#93a3b4" stroke-width="1.1"/>'+
    '<path d="M0,-9.5 3.4,2.6 0,0.4 -3.4,2.6z" fill="#1e3d5c"/><path d="M0,0.4 3.4,2.6 0,9.5 -3.4,2.6z" fill="#b7c3ce"/>'+
    '<text x="0" y="-18.5" text-anchor="middle" font-size="8" font-weight="800" fill="#31465d"'+haloStroke(2.4)+'>N</text></g>');
  furn.push('<g transform="translate(292,502)">'+
    '<rect x="0" y="0" width="72" height="3" rx="1.5" fill="#31465d" opacity=".45"/>'+
    '<rect x="0" y="0" width="36" height="3" rx="1.5" fill="#31465d"/>'+
    '<rect x="0" y="-4" width="2" height="11" fill="#31465d" opacity=".65"/>'+
    '<rect x="35" y="-4" width="2" height="11" fill="#31465d" opacity=".65"/>'+
    '<rect x="70" y="-4" width="2" height="11" fill="#31465d" opacity=".65"/>'+
    '<text x="0" y="-8" font-size="7.4" font-weight="800" letter-spacing=".1em" fill="#41586e"'+haloStroke(2.6)+'>600 M</text></g>');

  /* =========================================================
     13 · BUILDINGS out — sorted back to front, landmarks mixed in
     ========================================================= */
  var items = [];
  for(var bi=0; bi<blds.length; bi++) items.push({ y1: blds[bi].y + blds[bi].d, s: buildingStr(blds[bi]) });
  items.push({ y1: CATH.y+CATH.d, s: cathedralStr().s });
  items.push({ y1: HALL.y+HALL.d, s: hallStr().s });
  items.push({ y1: TERM.y+TERM.d, s: terminusStr().s });
  items.sort(function(a,b){ return a.y1 - b.y1; });
  for(var ii=0; ii<items.length; ii++) city2.push(items[ii].s);

  /* ---------- inject ---------- */
  document.getElementById("ground").innerHTML = ground.join("");
  document.getElementById("city2").innerHTML  = city2.join("");
  document.getElementById("net").innerHTML    = net.join("");
  document.getElementById("paths").innerHTML  = paths.join("");
  document.getElementById("stn").innerHTML    = stn.join("");
  document.getElementById("chr").innerHTML    = chr.join("");
  document.getElementById("furn").innerHTML   = furn.join("");

  /* ---------- top bar: 16 turns, pulses at 5 / 10 / 15 ---------- */
  var segEl = document.getElementById("seg"), sh = "", t;
  for(t=1;t<=16;t++){
    var cls = [];
    if(t===5||t===10||t===15) cls.push("pulse");
    if(t<=7) cls.push("on");
    if(t===7) cls.push("now");
    sh += '<i class="'+cls.join(" ")+'"></i>';
  }
  segEl.innerHTML = sh;

  var KIT_ICON = {
    taxi:'<path d="M2.4 8.4h15.2l-1.4-4.2A2 2 0 0 0 14.3 2.8H5.7A2 2 0 0 0 3.8 4.2z"/><rect x="1.6" y="8.4" width="16.8" height="4.2" rx="1.2"/><rect x="8.1" y="0.8" width="5.8" height="1.9" rx=".5"/><circle cx="5.9" cy="15.1" r="1.9"/><circle cx="14.1" cy="15.1" r="1.9"/>',
    bus :'<path d="M4.4 2.6h11.2a2.4 2.4 0 0 1 2.4 2.4v8.2H2v-8.2a2.4 2.4 0 0 1 2.4-2.4zM2 8.2h16v2.4H2z"/><circle cx="5.6" cy="15.2" r="1.5"/><circle cx="14.4" cy="15.2" r="1.5"/>',
    metro:'<rect x="4" y="1.6" width="12" height="12.4" rx="2.6"/><rect x="6" y="3.9" width="8" height="3.8" rx=".9" fill="#ffffff" opacity=".85"/><path d="M6.6 15.6 4.6 18.6M13.4 15.6l2 3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/>',
    spec:'<path d="M2.6 2h3.4l8.6 14h-3.4z"/><path d="M12.2 2.6h6.2l-2.2 3.6h-2.6l1-1.7h-3.1z"/>',
    foot:'<path d="M4.6 2.6c.95 0 1.6.85 1.6 2 0 1.35-.5 2.2-.4 3.55.1 1.35-1.5 1.7-2.3 1.15-.85-.55-1.05-1.7-.95-2.85.1-1.45.2-2.1.6-2.95.3-.6.85-.9 1.45-.9zM11 7.4c.95 0 1.6.85 1.6 2 0 1.35-.5 2.2-.4 3.55.1 1.35-1.5 1.7-2.3 1.15-.85-.55-1.05-1.7-.95-2.85.1-1.45.2-2.1.6-2.95.3-.6.85-.9 1.45-.9z"/>',
    scoo:'<path d="M2.6 1.6h3.6l3.9 9.4h4l1.2-4.6h2.6l-1.8 7.1h-5.6L6.4 4.1H2.6zM4.8 13a1.9 1.9 0 1 1 0 3.8 1.9 1.9 0 0 1 0-3.8z"/>'
  };
  var KIT = [
    { k:"taxi",   nm:"Taxi",   v:8, on:true,  legal:["n5"] },
    { k:"bus",    nm:"Bus",    v:4, on:true,  legal:["n4"] },
    { k:"scoo",   nm:"Scoot",  v:3, on:true,  legal:["n3"], hot:true },
    { k:"metro",  nm:"Metro",  v:3, on:false, legal:[] },
    { k:"foot",   nm:"Foot",   v:8, on:true,  legal:["n2","n9"] },
    { k:"spec",   nm:"Special",v:2, on:true,  legal:[] }
  ];
  document.getElementById("kit").innerHTML = KIT.map(function(it){
    var cls = "ti" + (it.hot ? " hot" : (it.on ? (it.legal.length?" legal":"") : " off"));
    var fill = it.hot ? "#5b21b6" : (it.on ? (it.legal.length ? "#16293c" : "#7d8fa0") : "#9dacba");
    return '<div class="'+cls+'" title="'+it.nm+' — '+it.v+' left">'+
      (it.hot ? '<span class="pick">DOUBLE MOVE</span>' : '')+
      '<svg class="g" viewBox="0 0 20 20" aria-hidden="true" fill="'+fill+'" '+
      (it.on?'':'opacity=".75"')+'>'+KIT_ICON[it.k]+'</svg>'+
      (it.on ? '' : '<span class="offx"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.6 2.6 7.4 7.4M7.4 2.6 2.6 7.4"/></svg></span>')+
      '<span class="vl">'+it.v+'</span>'+
      '<span class="nm">'+it.nm+'</span></div>';
  }).join("");

  /* ---------- self-test: a block must never sit on a road or a station ---------- */
  (function(){
    var roadPts=[], i, k;
    for(k in STREET) roadPts.push({pts:STREET[k], r:9});
    for(k in BUS)    roadPts.push({pts:BUS[k], r:10});
    for(i=0;i<lanePolys.length;i++) roadPts.push({pts:lanePolys[i].pts, r:7});
    roadPts.push({pts:METRO, r:7});
    blds.forEach(function(b){
      var q=[[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.d],[b.x,b.y+b.d]], j, c;
      for(c=0;c<4;c++){
        for(j=0;j<roadPts.length;j++){
          var minD=Infinity;
          for(i=0;i<roadPts[j].pts.length-1;i++){
            minD=Math.min(minD, distSeg(q[c][0],q[c][1], roadPts[j].pts[i][0],roadPts[j].pts[i][1],
                                        roadPts[j].pts[i+1][0],roadPts[j].pts[i+1][1]));
          }
          if(minD < roadPts[j].r - 4.5) problems.push('building corner on a road at '+b.x+','+b.y);
        }
        for(k in NODE){
          if(Math.hypot(q[c][0]-NODE[k].x, q[c][1]-NODE[k].y) < 12) problems.push('building corner on station '+k);
        }
      }
    });
    window.__XYARD_SELFTEST__ = { stage:"390x844", problems:problems.slice(0),
      blocks:{ placed:placedCount, yards:yards.length, requested:placedCount, dropped:0 },
      reach:reach.slice(0), nodes:Object.keys(P).length };
    if(problems.length){
      for(var q2=0;q2<problems.length;q2++) console.error("[xyard-s1-geometry] " + problems[q2]);
    }
  })();

  /* ---------- measurement, for the automated overflow check ---------- */
  window.__XYARD_MEASURE__ = function(){
    var st = document.getElementById("stage");
    var r = st.getBoundingClientRect();
    var out = { stage:[r.width, r.height], over:[] };
    var svgRoot = st.querySelector("svg");
    Array.prototype.forEach.call(st.querySelectorAll("*"), function(el){
      if(svgRoot && svgRoot.contains(el)) return;   /* SVG is clipped by its viewBox on purpose */
      var b = el.getBoundingClientRect();
      if(b.bottom > r.bottom + 0.6 || b.top < r.top - 0.6 ||
         b.right > r.right + 0.6 || b.left < r.left - 0.6){
        out.over.push({ tag:el.tagName, cls:el.className && el.className.baseVal !== undefined ? el.className.baseVal : (el.className||""),
                        box:[f(b.left),f(b.top),f(b.width),f(b.height)] });
      }
    });
    var mp = document.querySelector(".map svg");
    out.mapSlot = mp.getBoundingClientRect().width + "x" + mp.getBoundingClientRect().height;
    out.scroll = [document.documentElement.scrollWidth, document.documentElement.scrollHeight];
    return out;
  };
})();
</script>
